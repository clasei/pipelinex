<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pipelinex | flow state trainer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0099dd",
                        "primary-dim": "rgba(0, 153, 221, 0.08)",
                        "primary-subtle": "rgba(0, 153, 221, 0.04)",
                        "background-dark": "#020408",
                        "surface-dark": "#0a0f14",
                        "surface-darker": "#060a0f",
                        "border-dark": "#151f2a",
                        "border-subtle": "#0f191f",
                        "text-grey": "#6b7280",
                        "text-grey-light": "#8b95a5",
                    },
                    fontFamily: {
                        "display": ["Outfit", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'crystal': 'crystal 3s ease-in-out infinite',
                    },
                    keyframes: {
                        crystal: {
                            '0%, 100%': { opacity: '0.3', filter: 'blur(0px)' },
                            '50%': { opacity: '0.6', filter: 'blur(1px)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        * { text-transform: lowercase; }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        body {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scrollbar-width: thin;
            scrollbar-color: #151f2a #020408;
        }

        /* Custom Scrollbar for Webkit */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020408; }
        ::-webkit-scrollbar-thumb { background: #151f2a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #0099dd; }

        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-track { background: #020408; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #151f2a; border-radius: 10px; }

        /* Crystal effect - subtle glow */
        .crystal-glow {
            position: relative;
            animation: crystal 3s ease-in-out infinite;
        }

        .crystal-border {
            box-shadow: inset 0 0 20px rgba(0, 153, 221, 0.05), 0 0 20px rgba(0, 153, 221, 0.08);
        }

        .neon-glow:hover {
            box-shadow: 0 0 20px rgba(0, 153, 221, 0.15);
        }

        .custom-range {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #0099dd;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 8px rgba(0, 153, 221, 0.4), inset 0 0 4px rgba(0, 153, 221, 0.2);
        }

        .custom-range::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #151f2a;
            border-radius: 2px;
        }

        /* Range styling for Firefox */
        .custom-range::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border: none;
            border-radius: 50%;
            background: #0099dd;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 153, 221, 0.4);
        }

        .custom-range::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #151f2a;
            border-radius: 2px;
        }
    </style>
